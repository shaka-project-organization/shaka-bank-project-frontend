
name: Bank Frontend Pipeline

on:
  push:
    branches:
      - main
  # pull_request:
  #   branches:
  #     - cicd

jobs:
  Continues-Integration_build_and_push:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3
      with:
        repository: shaka-project-organization/shaka-bank-project-frontend
        ref: main


    - name: Log in to awscli
      uses: aws-actions/configure-aws-credentials@v3
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: us-east-1


    - name: Build container image
      run: docker build -t shaka-bank-frontend .

    - name: Log in to ECR with short-lived credentials
      run: |
        aws ecr get-login-password --region us-east-1 | docker login --username AWS --password-stdin ${{ vars.ECR_REPO }}
  
    - name: Tag Docker image
      run: docker tag shaka-bank-frontend:latest ${{ vars.ECR_REPO }}/shaka-bank-frontend:${{ github.run_number }}
    
    - name: Push image to ECR
      run: docker push ${{ vars.ECR_REPO }}/shaka-bank-frontend:${{ github.run_number }}


    - name: Clean up Docker image locally
      run: |
        docker rmi shaka-bank-frontend:latest
        docker rmi ${{ vars.ECR_REPO }}/shaka-bank-frontend:${{ github.run_number }}

    - name: Clean up GitHub repo on runner
      run: rm -rf ./*


  
  Continues-Update_k8s_manifest:
    runs-on: ubuntu-latest
    needs: Continues-Integration_build_and_push
    steps:
    - steps:
    - name: Checkout k8s manifest repo
      uses: actions/checkout@v3
      with:
        repository: shaka-project-organization/shaka-bank-project-kubernetes-manifest
        token: ${{ secrets.GIT_PASSWORD }}
        path: shaka-bank-project-kubernetes-manifest

    - name: Update k8s manifest
      run: |
        cd shaka-bank-project-kubernetes-manifest
        git config --global user.email "shakajimoh23@gmail.com"
        git config --global user.name "Shaka-Jimoh m"
        sed -i "s+${{ vars.ECR_REPO }}/shaka-bank-frontend:.*+${{ vars.ECR_REPO }}/shaka-bank-frontend:${{ github.run_number }}+g" ./bank-project/frontend.yaml
        git add bank-project/frontend.yaml
        git commit -m "Update frontend image to version ${{ github.run_number }}"
        git push
